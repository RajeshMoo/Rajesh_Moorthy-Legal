function wirePsf(){
  const render=i=>{const p=PROBLEMS[i];const s=svc(p[2]);
    $("#psfAns").innerHTML='<span class="eyebrow" style="color:#D9C077">Likely solution</span><p style="font-size:1.08rem;color:#fff">'+esc(p[1])+'</p><a class="btn btn-gold" href="#/services/'+p[2]+'">See the relevant service →</a>';};
  render(0);
  $$(".psf-opt").forEach(btn=>btn.onclick=()=>{$$(".psf-opt").forEach(b=>b.setAttribute("aria-pressed","false"));btn.setAttribute("aria-pressed","true");render(+btn.dataset.i);});
}
function wireContact(){
  let mode="c",sum="";
  const setM=m=>{mode=m;$("#mC").setAttribute("aria-pressed",m==="c");$("#mQ").setAttribute("aria-pressed",m==="q");$("#dtg").style.display=m==="c"?"":"none";$("#fS").textContent=m==="c"?"Request a Consultation":"Submit Your Question";};
  $("#mC").onclick=()=>setM("c");$("#mQ").onclick=()=>setM("q");
  const n=new Date();n.setMinutes(n.getMinutes()-n.getTimezoneOffset());$("#fT").min=n.toISOString().slice(0,16);
  $("#form").onsubmit=e=>{
    e.preventDefault();let ok=true;
    const chk=(el,t)=>{const b=!t(el.value.trim());el.classList.toggle("bad",b);if(b)ok=false;};
    chk($("#fN"),v=>v.length>1);chk($("#fE"),v=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v));chk($("#fP"),v=>v.replace(/\D/g,"").length>=7);chk($("#fD"),v=>v.length>9);
    const c=$("#fC").checked;$("#cE").style.display=c?"none":"block";if(!c)ok=false;
    if(!ok){toast("Please check the highlighted fields.");return;}
    const areaSlug=$("#fA").value,areaObj=svc(areaSlug);
    const f={"Type":mode==="c"?"Consultation request":"Legal question","Name":$("#fN").value.trim(),"Email":$("#fE").value.trim(),"Phone":$("#fP").value.trim(),"Legal area":areaObj?areaObj.name:"Not sure","Preferred contact":$("input[name=pf]:checked").value,"Preferred time":mode==="c"?$("#fT").value:"","Description":$("#fD").value.trim()};
    sum=Object.entries(f).filter(x=>x[1]).map(x=>x[0]+": "+x[1]).join("\n");
    const box=$("#done");
    box.innerHTML='<b>Opening your email app…</b><p style="margin:8px 0 12px">This static preview file can\'t submit to a server, so it opens your email app instead, addressed to '+esc(CONFIG.email)+' with your details pre-filled. Press Send there to finish.</p><button class="btn btn-navy" type="button" id="cp">Copy enquiry summary</button>';
    box.classList.add("show");
    $("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(sum);toast("Copied.");}catch(err){toast("Copy not available.");}};
    try{location.href="mailto:"+CONFIG.email+"?subject="+encodeURIComponent("Website enquiry: "+f.Type+" from "+f.Name)+"&body="+encodeURIComponent(sum);}catch(err){}
  };
}

/* ============================== ROUTER ============================== */
function route(){
  const parts=(location.hash.replace(/^#\/?/,"")||"").split("/"),p=parts[0]||"home",s=parts[1];
  let html,after;
  if(p==="about")html=pgAbout();
  else if(p==="services")html=s?pgService(s):pgServices();
  else if(p==="cases")html=pgCases();
  else if(p==="insights"){html=s?pgArticle(s):pgInsights();}
  else if(p==="resources")html=pgResources();
  else if(p==="contact"){html=pgContact(s);after=wireContact;}
  else {html=pgHome();after=wirePsf;}
  $("#app").innerHTML=html;
  if(after)after();
  $$("#nav a,#mnav a").forEach(a=>a.classList.toggle("on",a.dataset.r===p));
  const titles={home:"Raj & Raj Associates | Clear Legal Help",about:"About | Raj & Raj Associates",services:"Legal Services | Raj & Raj Associates",cases:"Case Law | Raj & Raj Associates",insights:"Legal Insights | Raj & Raj Associates",resources:"Resources | Raj & Raj Associates",contact:"Contact | Raj & Raj Associates"};
  document.title=titles[p]||titles.home;
  if(!(p==="cases"&&s))window.scrollTo(0,0);
}
addEventListener("hashchange",route);route();
